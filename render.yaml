services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: sports-league-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRE
        value: 15m
      - key: JWT_REFRESH_EXPIRE
        value: 7d

  # ── Admin Dashboard ──────────────────────────────────────────────────────────
  - type: web
    name: sports-league-admin
    runtime: static
    plan: free
    rootDir: frontend/admin-app
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Public App ───────────────────────────────────────────────────────────────
  - type: web
    name: sports-league-public
    runtime: static
    plan: free
    rootDir: frontend/public-app
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
