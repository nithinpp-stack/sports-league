services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: sports-league-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRE
        value: 15m
      - key: JWT_REFRESH_EXPIRE
        value: 7d
      # Set these manually in Render dashboard after deploy:
      # MONGODB_URI, JWT_SECRET, JWT_REFRESH_SECRET, CORS_ORIGINS

  # ── Admin Dashboard ──────────────────────────────────────────────────────────
  - type: web
    name: sports-league-admin
    runtime: static
    rootDir: frontend/admin-app
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false  # Set this to your backend Render URL

  # ── Public App ───────────────────────────────────────────────────────────────
  - type: web
    name: sports-league-public
    runtime: static
    rootDir: frontend/public-app
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false  # Set this to your backend Render URL
